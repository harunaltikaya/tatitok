<!-- @dsCard group="Type" viewport="700x200" name="Quiet hero numbers" subtitle="Large numbers in regular weight — never bold-shouting" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .stack { display: flex; align-items: flex-end; gap: 36px; flex-wrap: wrap; }
  .item .l { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; }
  .n { font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .hero { font-size: 44px; color: var(--text-positive); }
  .stat { font-size: 30px; color: var(--text-primary); }
  .xl { font-size: 22px; color: var(--text-primary); }
  .meta { margin-top: 14px; font-size: 12px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="stack">
    <div class="item"><div class="l">value extracted · hero 44</div><div class="n hero">$4,182.55</div></div>
    <div class="item"><div class="l">stat 30</div><div class="n stat">$908.49</div></div>
    <div class="item"><div class="l">xl 22</div><div class="n xl">1.18B</div></div>
  </div>
  <div class="meta">Hero numbers stay at regular weight and tight tracking; color (not weight) marks the positive one.</div>
</body>
</html>

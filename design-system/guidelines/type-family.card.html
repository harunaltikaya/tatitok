<!-- @dsCard group="Type" viewport="700x200" name="Jost — two weights" subtitle="One geometric family; regular (400) and medium (500) only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); color: var(--text-primary); }
  .specimens { display: flex; gap: 40px; align-items: flex-end; }
  .big { font-size: 56px; line-height: 1; letter-spacing: -0.01em; }
  .r { font-weight: 400; }
  .m { font-weight: 500; }
  .wlabel { margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
  .wlabel b { color: var(--text-secondary); font-weight: 500; }
  .glyphs { margin-top: 18px; padding-top: 16px; border-top: 0.5px solid var(--border-hairline); font-size: 22px; color: var(--text-secondary); display: flex; gap: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="specimens">
    <div>
      <div class="big r">tatitok</div>
      <div class="wlabel">regular · <b>400</b></div>
    </div>
    <div>
      <div class="big m">tatitok</div>
      <div class="wlabel">medium · <b>500</b></div>
    </div>
  </div>
  <div class="glyphs">
    <span class="r">ABCG abcg</span>
    <span class="r" style="font-variant-numeric: tabular-nums">0123456789</span>
    <span class="r">$ × → · *</span>
  </div>
</body>
</html>

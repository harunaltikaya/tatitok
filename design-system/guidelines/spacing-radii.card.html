<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & flat elevation" subtitle="Soft corners; flat surfaces — the only shadow is for true overlays" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .box { height: 64px; background: var(--surface-card); border: 0.5px solid var(--border-hairline); }
  .name { margin-top: 9px; font-size: 12px; color: var(--text-secondary); }
  .meta { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .overlay { height: 64px; background: var(--surface-raised); border: 0.5px solid var(--border-hairline); border-radius: var(--radius-md); box-shadow: var(--shadow-overlay); }
</style>
</head>
<body>
<div class="grid">
  <div><div class="box" style="border-radius: var(--radius-xs)"></div><div class="name">xs</div><div class="meta">4px · tags</div></div>
  <div><div class="box" style="border-radius: var(--radius-sm)"></div><div class="name">sm</div><div class="meta">6px · chips</div></div>
  <div><div class="box" style="border-radius: var(--radius-md)"></div><div class="name">md</div><div class="meta">10px · controls</div></div>
  <div><div class="box" style="border-radius: var(--radius-lg)"></div><div class="name">lg</div><div class="meta">14px · cards</div></div>
  <div><div class="box" style="border-radius: var(--radius-pill)"></div><div class="name">pill</div><div class="meta">dots · meters</div></div>
  <div><div class="overlay"></div><div class="name">overlay shadow</div><div class="meta">menus only</div></div>
</div>
</body>
</html>

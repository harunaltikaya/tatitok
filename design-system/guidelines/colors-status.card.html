<!-- @dsCard group="Colors" viewport="700x170" name="Status & the positive number" subtitle="Value extracted is the emotional center — rendered in the savings green" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 14px; align-items: stretch; }
  .hero { border-radius: var(--radius-md); border: 0.5px solid var(--border-hairline); background: var(--surface-card); padding: 14px 16px; }
  .hl { font-size: 12px; color: var(--text-tertiary); }
  .hn { font-size: 34px; color: var(--text-positive); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
  .sw { border-radius: var(--radius-md); height: 56px; border: 0.5px solid var(--border-hairline); }
  .name { margin-top: 9px; font-size: 13px; color: var(--text-primary); }
  .meta { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="grid">
  <div class="hero">
    <div class="hl">value extracted</div>
    <div class="hn">$4,182.55</div>
    <div class="meta" style="margin-top:6px">4.5× your $920/mo</div>
  </div>
  <div>
    <div class="sw" style="background: var(--color-positive)"></div>
    <div class="name">positive</div>
    <div class="meta">#34d399</div>
  </div>
  <div>
    <div class="sw" style="background: var(--color-warning)"></div>
    <div class="name">warning</div>
    <div class="meta">unpriced floor · #f5b547</div>
  </div>
  <div>
    <div class="sw" style="background: var(--color-danger)"></div>
    <div class="name">danger</div>
    <div class="meta">over cap · #f0726f</div>
  </div>
</div>
</body>
</html>

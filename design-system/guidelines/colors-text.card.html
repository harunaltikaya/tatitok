<!-- @dsCard group="Colors" viewport="700x160" name="Text on dark" subtitle="A single neutral ramp carries all text — primary to faint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 0.5px solid var(--border-hairline); }
  .row:last-child { border-bottom: none; }
  .samp { font-size: 18px; width: 200px; }
  .name { font-size: 13px; color: var(--text-tertiary); width: 140px; }
  .meta { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row"><span class="samp" style="color: var(--text-primary)">value extracted</span><span class="name">primary</span><span class="meta">#f4f4f5</span></div>
  <div class="row"><span class="samp" style="color: var(--text-secondary)">141.46M tokens</span><span class="name">secondary</span><span class="meta">#a1a1aa</span></div>
  <div class="row"><span class="samp" style="color: var(--text-tertiary)">range totals</span><span class="name">tertiary · labels</span><span class="meta">#71717a</span></div>
  <div class="row"><span class="samp" style="color: var(--text-faint)">served from rollups</span><span class="name">faint · meta</span><span class="meta">#52525b</span></div>
</body>
</html>

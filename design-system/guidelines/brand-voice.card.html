<!-- @dsCard group="Brand" viewport="700x210" name="Voice — precise, understated" subtitle="Sentence case, developer-native, quietly proud of the savings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); color: var(--text-secondary); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  h4 { margin: 0 0 10px; font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
  .line { display: flex; gap: 9px; align-items: baseline; padding: 4px 0; font-size: 14px; }
  .yes { color: var(--color-positive); }
  .no { color: var(--text-faint); }
  .do { color: var(--text-primary); }
  .dont { color: var(--text-faint); text-decoration: line-through; }
</style>
</head>
<body>
<div class="cols">
  <div>
    <h4>how tatitok writes</h4>
    <div class="line"><span class="yes">✓</span><span class="do">value extracted</span></div>
    <div class="line"><span class="yes">✓</span><span class="do">resets in 2h 14m</span></div>
    <div class="line"><span class="yes">✓</span><span class="do">no active window — the next event opens one</span></div>
    <div class="line"><span class="yes">✓</span><span class="do">4.5× your $920/mo</span></div>
  </div>
  <div>
    <h4>never</h4>
    <div class="line"><span class="no">✕</span><span class="dont">VALUE EXTRACTED</span></div>
    <div class="line"><span class="no">✕</span><span class="dont">You're crushing it! 🚀</span></div>
    <div class="line"><span class="no">✕</span><span class="dont">Massive savings unlocked!!</span></div>
    <div class="line"><span class="no">✕</span><span class="dont">Title Case Headings</span></div>
  </div>
</div>
</body>
</html>

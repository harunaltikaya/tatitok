<!-- @dsCard group="Colors" viewport="700x180" name="Neutral surfaces" subtitle="Flat dark surfaces separated by 0.5px hairlines — no shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-md); height: 70px; border: 0.5px solid var(--border-hairline); }
  .name { margin-top: 9px; font-size: 12px; color: var(--text-primary); }
  .meta { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .bordsw { border-radius: var(--radius-md); height: 70px; background: var(--surface-card); border: 0.5px solid var(--border-strong); }
</style>
</head>
<body>
<div class="grid">
  <div><div class="sw" style="background: var(--bg-app)"></div><div class="name">app background</div><div class="meta">#09090b</div></div>
  <div><div class="sw" style="background: var(--surface-card)"></div><div class="name">card surface</div><div class="meta">#161618</div></div>
  <div><div class="sw" style="background: var(--surface-raised)"></div><div class="name">raised / hover</div><div class="meta">#1b1b1e</div></div>
  <div><div class="sw" style="background: var(--surface-inset)"></div><div class="name">inset / track</div><div class="meta">#121214</div></div>
  <div><div class="bordsw"></div><div class="name">hairline border</div><div class="meta">0.5px · 9% white</div></div>
</div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x170" name="One number format" subtitle="The same compact format everywhere — tokens, money, ratios" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { border: 0.5px solid var(--border-hairline); border-radius: var(--radius-md); background: var(--surface-card); padding: 14px; }
  .l { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
  .vals { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--text-primary); font-size: 17px; }
  .vals span { white-space: nowrap; }
  .note { margin-top: 14px; font-size: 12px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="l">tokens — compact, fixed precision</div><div class="vals"><span>1.18B</span><span>141.46M</span><span>4.5k</span><span>820</span></div></div>
    <div class="cell"><div class="l">money — sub-cent stays honest</div><div class="vals"><span>$908.49</span><span>$27.41</span><span>$0.0034</span></div></div>
    <div class="cell"><div class="l">ratio — value vs price</div><div class="vals"><span>4.5×</span><span>12.1×</span><span>0.8×</span></div></div>
  </div>
  <div class="note">All numbers are tabular (font-variant-numeric: tabular-nums) so columns align. A trailing <span style="color:var(--color-warning)">*</span> means the figure is a floor; <span style="color:var(--text-secondary)">≈</span> precedes an estimate.</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 18px; }
  .lbl { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Select, Switch } = window.TatitokDesignSystem_b39a28;
function Demo() {
  const [tz, setTz] = React.useState("Europe/Istanbul");
  const [by, setBy] = React.useState("harness");
  const [est, setEst] = React.useState(false);
  const [light, setLight] = React.useState(false);
  return (
    <div>
      <div className="row">
        <span className="lbl">days in</span>
        <Select value={tz} onChange={(e) => setTz(e.target.value)}
          options={["UTC", "Europe/Istanbul", "America/New_York", "Asia/Tokyo"]} aria-label="timezone" />
        <span className="lbl">group by</span>
        <Select value={by} onChange={(e) => setBy(e.target.value)}
          options={["harness", "provider", "model", "project"]} aria-label="group by" />
      </div>
      <div className="row">
        <Switch checked={est} onChange={(e) => setEst(e.target.checked)} label="include estimates" />
        <Switch checked={light} onChange={(e) => setLight(e.target.checked)} label="light mode" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

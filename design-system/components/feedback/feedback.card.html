<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-app); color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 16px; }
  .leg { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .cap { width: 100%; margin: 0 0 -6px; font-size: 11px; color: var(--text-faint); }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; width: 460px; max-width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ClassDot, Badge, MeterBar } = window.TatitokDesignSystem_b39a28;
const usd = (v) => "$" + v.toFixed(2);
function Demo() {
  return (
    <div>
      <div className="row">
        <span className="cap">economic class · the only categorical hues</span>
        <span className="leg"><ClassDot tone="subscription" /> subscription</span>
        <span className="leg"><ClassDot tone="metered" /> metered API</span>
        <span className="leg"><ClassDot tone="local" /> local</span>
        <span className="leg"><ClassDot tone="free" /> free</span>
        <span className="leg"><ClassDot tone="live" size={9} pulse /> live</span>
      </div>
      <div className="row">
        <span className="cap">accuracy class · cost-basis tag · ratio</span>
        <Badge tone="exact" dot>exact</Badge>
        <Badge tone="derived" dot>derived</Badge>
        <Badge tone="estimated" dot>estimated</Badge>
        <Badge tone="tag">plan_included</Badge>
        <Badge tone="positive">4.5×</Badge>
        <Badge tone="danger">over cap</Badge>
      </div>
      <div className="row">
        <span className="cap">plan-window meters · auto-escalate at the cap</span>
        <div className="meters">
          <MeterBar value={41.2} max={120} showLabel format={usd} />
          <MeterBar value={112} max={120} showLabel format={usd} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

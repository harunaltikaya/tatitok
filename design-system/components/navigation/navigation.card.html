<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-app); color: var(--text-tertiary); font-family: var(--font-sans); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, FilterChip } = window.TatitokDesignSystem_b39a28;
function Demo() {
  const [page, setPage] = React.useState("overview");
  const [chips, setChips] = React.useState([
    { dim: "provider", value: "anthropic" },
    { dim: "harness", value: "claude-code" },
    { dim: "model", value: "claude-fable-5" },
  ]);
  return (
    <div>
      <div className="row">
        <Tabs value={page} onChange={setPage} tabs={["overview", "explore", "live", "collectors"]} />
      </div>
      <div className="row">
        <span>filters</span>
        {chips.map((c) => (
          <FilterChip key={c.dim} dim={c.dim} value={c.value}
            onRemove={() => setChips((cs) => cs.filter((x) => x.dim !== c.dim))} />
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

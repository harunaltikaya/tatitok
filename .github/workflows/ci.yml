name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Go binary embeds the built dashboard (web/embed.go: `//go:embed
      # all:dist`), but web/dist is gitignored and absent in a fresh checkout.
      # Build the bundle first so every go build/test/vet below can embed it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Build web bundle
        working-directory: web
        run: npm ci && npm run build
      - name: Fixture leak check
        run: make leakcheck
      - name: Test
        run: make test
        env:
          CGO_ENABLED: "0"
      - name: Cross-compile all targets
        # Bundle already built above; `-o web` skips the Makefile `web`
        # prerequisite (which runs `npm test` — node --test, JSX-limited).
        run: make -o web build-all
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned (review finding 14): "latest" let CI drift from the
          # locally used linter; bump deliberately together with local
          version: v2.12.2

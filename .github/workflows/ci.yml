name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fixture leak check
        run: make leakcheck
      - name: Test
        run: make test
        env:
          CGO_ENABLED: "0"
      - name: Cross-compile all targets
        run: make build-all
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned (review finding 14): "latest" let CI drift from the
          # locally used linter; bump deliberately together with local
          version: v2.12.2
